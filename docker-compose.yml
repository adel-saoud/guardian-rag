# Local stack: guardian + qdrant + ollama. Fully local, no API keys.
#
# Usage:
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.2:3b
#   curl http://localhost:8000/health
services:
  ollama:
    image: ollama/ollama:latest
    container_name: guardian-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: guardian-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  guardian:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardian-api
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      GUARDIAN_OLLAMA_BASE_URL: http://ollama:11434
      GUARDIAN_QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/home/guardian/.cache/huggingface

volumes:
  ollama-data:
  qdrant-data:
  hf-cache:
