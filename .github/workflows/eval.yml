name: Eval

# Manual only. The eval is deterministic (synthetic corpus, pinned models),
# so it runs when the corpus or a detector changes, not on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    name: PII recall + precision on the 30-doc golden corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Cache HuggingFace models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-gliner-multi-pii-v1

      - name: Install dependencies (with ml extra)
        run: uv sync --extra dev --extra ml

      - name: Run the eval with gates
        run: |
          uv run python scripts/eval.py \
            --with-gliner \
            --recall-gate 0.85 \
            --precision-gate 0.85 \
            --report eval/report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: eval/report.html
